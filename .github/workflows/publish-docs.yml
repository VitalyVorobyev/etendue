name: Publish Docs

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # calibration-rs tag the `[patch.crates-io]` sibling is cloned at. Keep in
  # step with the `vision-calibration-*` version requirement in Cargo.toml.
  CALIBRATION_RS_REF: v0.9.0

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clone calibration-rs sibling ([patch.crates-io] target)
        run: git clone --depth 1 --branch "$CALIBRATION_RS_REF" https://github.com/VitalyVorobyev/calibration-rs.git ../calibration-rs

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-docs

      - name: Install mdBook and plugins
        uses: taiki-e/install-action@v2
        with:
          tool: |
            mdbook@0.4.48
            mdbook-katex@0.9.4

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build rustdoc and book
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo doc --workspace --no-deps
          # The API landing page: every published crate.
          {
            echo '<!doctype html><meta charset="utf-8"><title>etendue API</title><h1>etendue crates</h1><ul>'
            for c in etendue_scene etendue_kinematics etendue_synth etendue_core etendue_cli; do
              echo "<li><a href=\"$c/index.html\">${c//_/-}</a></li>"
            done
            echo '</ul>'
          } > target/doc/index.html
          mdbook build book

      - name: Assemble Pages artifact
        run: |
          mkdir -p public/api
          rsync -a target/doc/ public/api/
          rsync -a book/book/ public/

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
