name: Publish Docs

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clone calibration-rs sibling (path dependency)
        run: git clone --depth 1 https://github.com/VitalyVorobyev/calibration-rs.git ../calibration-rs

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-docs

      - name: Install mdBook and plugins
        uses: taiki-e/install-action@v2
        with:
          tool: |
            mdbook@0.4.48
            mdbook-katex@0.9.4

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build rustdoc and book
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo doc --workspace --no-deps
          echo '<meta http-equiv="refresh" content="0; url=etendue_core/index.html">' > target/doc/index.html
          mdbook build book

      - name: Assemble Pages artifact
        run: |
          mkdir -p public/api
          rsync -a target/doc/ public/api/
          rsync -a book/book/ public/

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
