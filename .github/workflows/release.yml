name: Release

# A `v*.*.*` tag builds every artefact and publishes a GitHub Release: the
# etendue studio desktop app (Tauri bundles) and the `etendue` CLI, for Linux
# x64, macOS arm64 and Windows x64. `workflow_dispatch` is a dry run: the same
# builds, uploaded as workflow artefacts, with no release.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # calibration-rs tag the `[patch.crates-io]` sibling is cloned at. Keep in
  # step with the `vision-calibration-*` version requirement in Cargo.toml.
  CALIBRATION_RS_REF: v0.9.0
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: Release quality gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clone calibration-rs sibling ([patch.crates-io] target)
        shell: bash
        run: git clone --depth 1 --branch "$CALIBRATION_RS_REF" https://github.com/VitalyVorobyev/calibration-rs.git ../calibration-rs

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests (release mode)
        run: cargo test --workspace --release --locked

  cli:
    name: CLI ${{ matrix.target }}
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clone calibration-rs sibling ([patch.crates-io] target)
        shell: bash
        run: git clone --depth 1 --branch "$CALIBRATION_RS_REF" https://github.com/VitalyVorobyev/calibration-rs.git ../calibration-rs

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build the CLI
        run: cargo build --release --locked -p etendue-cli

      # The tag's version (the workspace version on a dry run).
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Package archive
        shell: bash
        run: |
          NAME="etendue-cli-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp LICENSE etendue.toml "dist/$NAME/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/etendue.exe "dist/$NAME/"
            (cd dist && 7z a -tzip "$NAME.zip" "$NAME" > /dev/null)
            echo "ARCHIVE=dist/$NAME.zip" >> "$GITHUB_ENV"
          else
            cp target/release/etendue "dist/$NAME/"
            tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"
            echo "ARCHIVE=dist/$NAME.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  desktop:
    name: Studio ${{ matrix.target }}
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: the oldest supported glibc the AppImage and .deb run on.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clone calibration-rs sibling ([patch.crates-io] target)
        shell: bash
        run: git clone --depth 1 --branch "$CALIBRATION_RS_REF" https://github.com/VitalyVorobyev/calibration-rs.git ../calibration-rs

      - name: System libraries (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            web/apps/studio/src-tauri -> target

      - name: Install wasm-pack
        shell: bash
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      # The robot meshes are git-ignored and rebuilt from pinned upstream SHAs;
      # the app bundles them with the examples.
      - name: Robot meshes
        run: uv run --locked --project tools/robot-assets tools/robot-assets/build.py

      # A release build reads its bundled resources, a path only release builds
      # take: test the shell in that profile too.
      - name: Shell tests (release profile)
        shell: bash
        run: |
          mkdir -p web/apps/studio/dist
          cargo test --release --locked --manifest-path web/apps/studio/src-tauri/Cargo.toml

      # The bundle's version is the tag's (the workspace version on a dry run).
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build the desktop app
        working-directory: web/apps/studio
        shell: bash
        run: |
          bun run desktop:build --bundles ${{ matrix.bundles }} --config "{\"version\": \"$VERSION\"}" -- --locked

      - name: Bundled resources
        shell: bash
        run: |
          # The examples and the robot meshes must be in what was bundled.
          T=web/apps/studio/src-tauri/target/release
          find "$T" -path '*examples/closed_loop_ur5e/scene.json' | grep -q . || { echo "examples not bundled"; exit 1; }
          find "$T" -path '*assets/robots/ur5e/meshes/*.glb' | grep -q . || { echo "robot meshes not bundled"; exit 1; }

      # Asset names without spaces (GitHub rewrites them): etendue-studio-<version>-<target>.<ext>.
      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p dist
          B=web/apps/studio/src-tauri/target/release/bundle
          N="etendue-studio-${VERSION}-${{ matrix.target }}"
          find "$B" -maxdepth 2 -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.AppImage' -o -name '*.deb' \) -print0 |
            while IFS= read -r -d '' f; do
              case "$f" in
                *-setup.exe) cp "$f" "dist/$N-setup.exe" ;;
                *) cp "$f" "dist/$N.${f##*.}" ;;
              esac
            done
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: studio-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    # Only a tag push publishes; a manual run is a dry run whatever its ref.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [gates, cli, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for CHANGELOG.md)
        uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Extract CHANGELOG section for this tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          # Fall back to auto-generated notes if extraction produced nothing meaningful
          if [ ! -s release-notes.md ] || ! grep -q '[^[:space:]]' release-notes.md; then
            echo "AUTO_NOTES=true" >> "$GITHUB_ENV"
          else
            echo "AUTO_NOTES=false" >> "$GITHUB_ENV"
          fi

      - name: Create release (with CHANGELOG body)
        if: env.AUTO_NOTES == 'false'
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: dist/**

      - name: Create release (auto-generated notes fallback)
        if: env.AUTO_NOTES == 'true'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/**
