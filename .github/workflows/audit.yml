name: Security Audit

on:
  schedule:
    - cron: '0 5 * * 1'   # every Monday at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  # calibration-rs tag the `[patch.crates-io]` sibling is cloned at. Keep in
  # step with the `vision-calibration-*` version requirement in Cargo.toml.
  CALIBRATION_RS_REF: v0.8.1

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Clone calibration-rs sibling ([patch.crates-io] target)
        run: git clone --depth 1 --branch "$CALIBRATION_RS_REF" https://github.com/VitalyVorobyev/calibration-rs.git ../calibration-rs
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # deny.toml lists RUSTSEC-2024-0436 (paste, upstream-blocked via
          # nalgebra 0.34 → simba → paste) in advisories.ignore.
          command: check advisories licenses bans sources
