name: Security Audit

on:
  schedule:
    - cron: '0 5 * * 1'   # every Monday at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Clone calibration-rs sibling (path dependency)
        run: git clone --depth 1 https://github.com/VitalyVorobyev/calibration-rs.git ../calibration-rs
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # deny.toml lists RUSTSEC-2024-0436 (paste, upstream-blocked via
          # nalgebra 0.34 → simba → paste) in advisories.ignore.
          command: check advisories licenses bans sources
