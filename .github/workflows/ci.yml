name: CI

on:
  push:
    branches: [ main ]
  pull_request:

env:
  # calibration-rs tag the `[patch.crates-io]` sibling is cloned at. Keep in
  # step with the `vision-calibration-*` version requirement in Cargo.toml.
  CALIBRATION_RS_REF: v0.8.1
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clone calibration-rs sibling ([patch.crates-io] target)
        shell: bash
        run: git clone --depth 1 --branch "$CALIBRATION_RS_REF" https://github.com/VitalyVorobyev/calibration-rs.git ../calibration-rs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cargo fmt
        run: cargo fmt --all --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --workspace --locked

      - name: Cargo doc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace

  # Workspace policy and per-crate feature matrix (CLAUDE.md): layering rules
  # (ADR 0001), JSON Schema drift, `--all-features` per crate, CLI smoke test.
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clone calibration-rs sibling ([patch.crates-io] target)
        run: git clone --depth 1 --branch "$CALIBRATION_RS_REF" https://github.com/VitalyVorobyev/calibration-rs.git ../calibration-rs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Layering (ADR 0001) and single nalgebra
        run: cargo xtask check-layering

      - name: JSON Schemas up to date
        run: cargo xtask emit-schemas --check

      - name: Clippy, all features, per crate
        run: |
          cargo clippy -p etendue-scene --all-targets --all-features -- -D warnings
          cargo clippy -p etendue-kinematics --all-targets --all-features -- -D warnings

      - name: Tests, all features, per crate (G1.1, G1.2 incl. OPW)
        run: |
          cargo test -p etendue-scene --all-features --locked
          cargo test -p etendue-kinematics --all-features --locked

      - name: CLI smoke test (P1-6 examples)
        run: |
          for ex in eye_in_hand_ur5e eye_to_hand_ur5e; do
            cargo run -q -p etendue-cli -- validate examples/$ex/scene.json examples/$ex/scenario.json
            cargo run -q -p etendue-cli -- bake examples/$ex/scene.json examples/$ex/scenario.json -o target/$ex.baked.json
          done

  # etendue-wasm (npm `@etendue/wasm`): wasm32 build + gate G0.1 — the wasm
  # build of the projection chain must match the native build bit-for-bit
  # (docs/measurements/g0_1_wasm_parity.md).
  wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clone calibration-rs sibling ([patch.crates-io] target)
        run: git clone --depth 1 --branch "$CALIBRATION_RS_REF" https://github.com/VitalyVorobyev/calibration-rs.git ../calibration-rs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Clippy (wasm32)
        run: cargo clippy -p etendue-wasm --target wasm32-unknown-unknown -- -D warnings

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build Node package
        run: wasm-pack build crates/etendue-wasm --target nodejs --release

      - name: G0.1 parity (wasm under Node vs native, bit-for-bit)
        run: |
          node crates/etendue-wasm/tests/node/g01_parity.mjs > target/g01.json
          cargo run -p etendue-wasm --example g01_verify -- target/g01.json
