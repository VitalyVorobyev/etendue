name: CI

on:
  push:
    branches: [ main ]
  pull_request:

env:
  # calibration-rs tag the `[patch.crates-io]` sibling is cloned at. Keep in
  # step with the `vision-calibration-*` version requirement in Cargo.toml.
  CALIBRATION_RS_REF: v0.8.2
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clone calibration-rs sibling ([patch.crates-io] target)
        shell: bash
        run: git clone --depth 1 --branch "$CALIBRATION_RS_REF" https://github.com/VitalyVorobyev/calibration-rs.git ../calibration-rs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cargo fmt
        run: cargo fmt --all --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --workspace --locked

      - name: Cargo doc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace

  # Workspace policy and per-crate feature matrix (CLAUDE.md): layering rules
  # (ADR 0001), JSON Schema drift, `--all-features` per crate, CLI smoke test.
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clone calibration-rs sibling ([patch.crates-io] target)
        run: git clone --depth 1 --branch "$CALIBRATION_RS_REF" https://github.com/VitalyVorobyev/calibration-rs.git ../calibration-rs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Layering (ADR 0001) and single nalgebra
        run: cargo xtask check-layering

      - name: JSON Schemas up to date
        run: cargo xtask emit-schemas --check

      - name: Clippy, all features, per crate
        run: |
          cargo clippy -p etendue-scene --all-targets --all-features -- -D warnings
          cargo clippy -p etendue-kinematics --all-targets --all-features -- -D warnings
          cargo clippy -p etendue-synth --all-targets --all-features -- -D warnings

      - name: Tests, all features, per crate (G1.1, G1.2 incl. OPW)
        run: |
          cargo test -p etendue-scene --all-features --locked
          cargo test -p etendue-kinematics --all-features --locked
          cargo test -p etendue-synth --all-features --locked

      - name: Blender script conventions (pure Python, no Blender)
        run: python3 -m unittest discover -s crates/etendue-cli/blender/tests -v

      - name: CLI smoke test (P1-6 examples)
        run: |
          for ex in eye_in_hand_ur5e eye_to_hand_ur5e closed_loop_ur5e; do
            cargo run -q -p etendue-cli -- validate examples/$ex/scene.json examples/$ex/scenario.json
            cargo run -q -p etendue-cli -- bake examples/$ex/scene.json examples/$ex/scenario.json -o target/$ex.baked.json
          done

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      # P5-1 on analytic correspondences (docs/measurements/closed_loop.md): etendue's
      # ground truth through calibration-rs's own solver recovers the true intrinsics and
      # hand-eye. Guards every frame and pose convention between the two.
      - name: Closed loop G5.1 (analytic correspondences)
        run: |
          cargo run -q -p etendue-cli -- gt examples/closed_loop_ur5e/scene.json examples/closed_loop_ur5e/scenario.json -o target/closed_loop
          uv run --locked --project tools/closed-loop tools/closed-loop/closed_loop.py target/closed_loop
          uv run --locked --project tools/closed-loop tools/closed-loop/closed_loop.py target/closed_loop --camera cam_left

  # etendue-wasm (npm `@etendue/wasm`): wasm32 build, gate G0.1 — the wasm
  # build of the projection chain must match the native build bit-for-bit
  # (docs/measurements/g0_1_wasm_parity.md) — and gate G2.1, the size budget
  # (docs/measurements/g2_1_wasm_size.md).
  wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clone calibration-rs sibling ([patch.crates-io] target)
        run: git clone --depth 1 --branch "$CALIBRATION_RS_REF" https://github.com/VitalyVorobyev/calibration-rs.git ../calibration-rs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Clippy (wasm32)
        run: cargo clippy -p etendue-wasm --target wasm32-unknown-unknown -- -D warnings

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build the npm package
        run: node crates/etendue-wasm/scripts/build-npm.mjs

      - name: G0.1 parity (wasm under Node vs native, bit-for-bit)
        run: |
          node crates/etendue-wasm/tests/node/g01_parity.mjs > target/g01.json
          cargo run -p etendue-wasm --example g01_verify -- target/g01.json

      - name: G2.1 size (release .wasm ≤ 1.5 MB gzipped)
        run: |
          size=$(gzip -9c crates/etendue-wasm/pkg/etendue_wasm_bg.wasm | wc -c)
          echo "etendue_wasm_bg.wasm: $(wc -c < crates/etendue-wasm/pkg/etendue_wasm_bg.wasm) bytes, $size gzipped"
          test "$size" -le 1572864

  # web/ (bun workspace): the incubated @vitavision packages and the studio.
  # Layering, types generated from schemas/, typecheck, lint, unit and story
  # tests (Chromium), build, and the studio's Playwright e2e suite. Gate G2.2
  # (perf) needs a GPU and runs locally (docs/measurements/g2_2_perf.md).
  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clone calibration-rs sibling ([patch.crates-io] target)
        run: git clone --depth 1 --branch "$CALIBRATION_RS_REF" https://github.com/VitalyVorobyev/calibration-rs.git ../calibration-rs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json

      - name: Build @etendue/wasm (a workspace member of web/)
        run: node crates/etendue-wasm/scripts/build-npm.mjs

      - name: Install
        working-directory: web
        run: bun install --frozen-lockfile

      - name: TS types up to date with schemas/
        working-directory: web
        run: bun run generate:types:check

      - name: Layering
        working-directory: web
        run: bun run check:deps

      - name: Typecheck
        working-directory: web
        run: bun run typecheck

      - name: Lint
        working-directory: web
        run: bun run lint

      - name: Install Chromium
        working-directory: web
        run: bunx playwright install --with-deps chromium

      - name: Unit and story tests
        working-directory: web
        run: bun run test

      - name: Build
        working-directory: web
        run: bun run build

      - name: Studio e2e
        working-directory: web/apps/studio
        run: bun run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/apps/studio/playwright-report
