[project]
name = "etendue-robot-assets"
version = "0.1.0"
description = "Reproducible robot asset pipeline for etendue: pinned upstream xacro -> URDF, per-link visual meshes -> GLB, robot.json manifest."
requires-python = ">=3.12,<3.13"
dependencies = [
    "lxml>=6.0",
    "numpy>=2.2",
    "pycollada>=0.9",
    "pyyaml>=6.0",
    "trimesh>=4.6",
    "xacro>=2.0",
]

[tool.uv]
package = false
