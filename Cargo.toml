[workspace]
members = [
    "crates/etendue-core",
    "crates/etendue-ui",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.85"
license = "MIT"
authors = ["Vitaly Vorobyev <vitaly.munchen@gmail.com>"]

[workspace.dependencies]
# --- Kernel deps -----------------------------------------------------------
# nalgebra is a HARD PIN: it must match calibration-rs exactly. etendue-core
# exchanges Isometry3<f64> / Point3<f64> / Matrix3<f64> across the
# vision-calibration-core path boundary; a semver-incompatible second
# nalgebra would make those distinct types and break every cross-crate call.
nalgebra = { version = "0.34", features = ["serde-serialize"] }
vision-calibration-core = { path = "../calibration-rs/crates/vision-calibration-core" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# Float-comparison assertions for kernel unit tests. 0.5 matches the version
# nalgebra already pulls in, so this adds nothing new to the lock tree.
approx = "0.5"
serde_json = "1"
# M9 Scheimpflug solver. Nelder-Mead handles the min-max worst-case-CoC
# objective without needing gradients (the cost is non-smooth at sample
# visibility / depth-window boundaries). `default-features = false` drops
# slog-logger and ndarray support we do not need.
argmin = { version = "0.11", default-features = false }
argmin-math = { version = "0.5", default-features = false, features = ["primitives", "vec"] }

# --- UI stack --------------------------------------------------------------
# egui / egui-wgpu / egui-winit are taken from one egui release line (0.34);
# egui_plot versions separately but its 0.35 line targets egui 0.34.
# wgpu 29 and winit 0.30 are the exact versions egui-wgpu/egui-winit 0.34
# declare — resolved empirically in M0, not guessed.
egui = "0.34"
egui-wgpu = "0.34"
egui-winit = "0.34"
egui_plot = "0.35"
wgpu = "29"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
rfd = "0.15"

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2
