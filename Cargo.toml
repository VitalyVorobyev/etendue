[workspace]
members = [
    "crates/etendue-cli",
    "crates/etendue-core",
    "crates/etendue-kinematics",
    "crates/etendue-scene",
    "crates/etendue-synth",
    "crates/etendue-wasm",
    "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/VitalyVorobyev/etendue"
authors = ["Vitaly Vorobyev <vitaly.munchen@gmail.com>"]

[workspace.dependencies]
# --- etendue crates (path + version, so dependents stay publishable) -------
etendue-core = { path = "crates/etendue-core", version = "0.1.0" }
etendue-kinematics = { path = "crates/etendue-kinematics", version = "0.1.0" }
etendue-scene = { path = "crates/etendue-scene", version = "0.1.0" }
etendue-synth = { path = "crates/etendue-synth", version = "0.1.0" }

# --- Kernel deps -----------------------------------------------------------
# nalgebra is a HARD PIN: it must match calibration-rs exactly. etendue-core
# exchanges Isometry3<f64> / Point3<f64> / Matrix3<f64> across the
# vision-calibration-core crate boundary; a semver-incompatible second
# nalgebra would make those distinct types and break every cross-crate call.
libm = "0.2"
nalgebra = { version = "0.34", features = ["serde-serialize"] }
# calibration-rs crates come from crates.io so every etendue library crate is
# publishable. For local development they are redirected to the sibling
# checkout by `[patch.crates-io]` at the bottom of this file.
vision-calibration-core = "0.9.0"
vision-calibration-dataset = "0.9.0"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# Float-comparison assertions for kernel unit tests. 0.5 matches the version
# nalgebra already pulls in, so this adds nothing new to the lock tree.
approx = "0.5"
# `float_roundtrip`: correctly-rounded float parsing. The default parser can be
# off by one ULP, which breaks bit-exact round trips of scenes, baked
# scenarios, and ground truth (caught by etendue-scene's property tests).
serde_json = { version = "1", features = ["float_roundtrip"] }
# JSON Schema derives behind each crate's `schemars` feature. Major version 1
# matches calibration-rs, whose types (`CameraParams`, `TargetSpec`,
# `Iso3Schema`) implement the same `JsonSchema` trait.
schemars = "1"
# Property tests (dev-only).
proptest = "1"
# Tooling (xtask, etendue-cli).
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# M9 Scheimpflug solver. Nelder-Mead handles the min-max worst-case-CoC
# objective without needing gradients (the cost is non-smooth at sample
# visibility / depth-window boundaries). `default-features = false` drops
# slog-logger and ndarray support we do not need.

# --- WASM facade -----------------------------------------------------------
wasm-bindgen = "0.2"
js-sys = "0.3"

# --- Synthesis (etendue-synth) ---------------------------------------------
# Blender renders arrive as multilayer OpenEXR (pure Rust, no unsafe); images
# leave as PNG. Both only in the native render path, not in @etendue/wasm.
exr = "1.74"
# P4-3 corner bias study (etendue-cli `measure g4-2`); no nalgebra, no `image`.
chess-corners = { version = "1.2", default-features = false }
png = "0.18"
# Target geometry (ADR 0006, P3-3): boards are what calib-targets prints, and their
# points are what it resolves. calib-targets accepts nalgebra >=0.34, <0.36 since
# 0.15.3, so it shares the pinned nalgebra. `charuco` is needed only for the marker
# layout and the dictionary lookup, the same ones calibration-rs's detector uses.
calib-targets-print = "0.15.5"
calib-targets-charuco = { version = "0.15.5", default-features = false }
# `etendue detect` (P5-1b): calib-targets' chessboard labeller over chess-corners'
# corners, the same crate calibration-rs's detector uses (already in the tree
# through calib-targets-print).
calib-targets-chessboard = "0.15.5"
# PuzzleBoard and PuzzlePole (P7-4): the supported pole periods, the pole's object frame,
# and their detectors. Already in the tree through calib-targets-print.
calib-targets-puzzleboard = "0.15.5"
# `etendue detect` (P7-5): the marker board detector. Already in the tree through
# calib-targets-print.
calib-targets-marker = "0.15.5"
# Sensor model noise (etendue-synth). Seeded only: ChaCha is stable across
# platforms and versions; default features off keep `getrandom` (OS entropy)
# out, per the determinism rule.
rand = { version = "0.10", default-features = false }
rand_chacha = { version = "0.10", default-features = false }
rand_distr = { version = "0.6", default-features = false, features = ["std_math"] }
# etendue.toml tool pins (etendue-cli).
toml = "0.9"

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2

# Local development: build against the sibling calibration-rs checkout
# (`../calibration-rs`) instead of the crates.io release. `cargo package` /
# `cargo publish` ignore patches, so published crates depend on crates.io
# `vision-calibration-*` only. The sibling must exist for this workspace to
# build; CI clones it at the tag matching the version requirement above.
[patch.crates-io]
vision-calibration-core = { path = "../calibration-rs/crates/vision-calibration-core" }
vision-calibration-dataset = { path = "../calibration-rs/crates/vision-calibration-dataset" }
