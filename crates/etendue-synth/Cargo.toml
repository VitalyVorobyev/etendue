[package]
name = "etendue-synth"
description = "Synthetic-image support for etendue: canonical render cameras and remap LUTs onto calibration-rs camera models"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
calib-targets-charuco = { workspace = true }
calib-targets-print = { workspace = true }
etendue-scene = { workspace = true }
nalgebra = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rand_distr = { workspace = true }
vision-calibration-core = { workspace = true }
vision-calibration-dataset = { workspace = true }
serde_json = { workspace = true }
exr = { workspace = true, optional = true }
png = { workspace = true, optional = true }

[features]
# Ingest of Blender EXR renders and PNG output (the native render path).
# Off for @etendue/wasm, which only needs the LUT.
images = ["dep:exr", "dep:png"]

[dev-dependencies]
etendue-kinematics = { workspace = true }
