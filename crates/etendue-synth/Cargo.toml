[package]
name = "etendue-synth"
description = "Synthetic calibration data for etendue: ground truth, calibration-rs datasets, canonical render cameras and remap LUTs, sensor model"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
calib-targets-charuco = { workspace = true }
calib-targets-print = { workspace = true }
calib-targets-puzzleboard = { workspace = true }
# The pose generator (P7-6) solves IK and checks feasibility (ADR 0001 allows it).
etendue-kinematics = { workspace = true }
etendue-core = { workspace = true }
etendue-scene = { workspace = true }
nalgebra = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rand_distr = { workspace = true }
vision-calibration-core = { workspace = true }
vision-calibration-dataset = { workspace = true }
serde_json = { workspace = true }
exr = { workspace = true, optional = true }
png = { workspace = true, optional = true }

[features]
# Ingest of Blender EXR renders and PNG output (the native render path).
# Off for @etendue/wasm, which only needs the LUT.
images = ["dep:exr", "dep:png"]
