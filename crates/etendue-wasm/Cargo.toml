[package]
name = "etendue-wasm"
description = "WebAssembly facade for the etendue kernel (npm @etendue/wasm)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
# Published to npm as `@etendue/wasm` only, never to crates.io
# (docs/adrs/0001-pivot.md).
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
etendue-core = { path = "../etendue-core" }
nalgebra = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }

# Backend selection only — nothing here is called directly. On
# `wasm32-unknown-unknown`, `getrandom` refuses to build without a JS entropy
# backend, and two versions of it sit in the dependency graph:
#
# - 0.4, via `vision-calibration-core` → `rand` 0.10 (default features). Drop
#   this line once calibration-rs trims `rand` to `default-features = false`
#   (upstream draft: branch `feat/core-wasm32`).
# - 0.3, via `etendue-core` → `argmin-math` (`vec` feature) → `rand` 0.9.
#
# Enabling `wasm_js` here turns the backend on for the whole graph through
# feature unification. The etendue kernel never draws OS entropy; this only
# makes the dependency graph compile.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
