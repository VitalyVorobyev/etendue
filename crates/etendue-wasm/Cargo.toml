[package]
name = "etendue-wasm"
description = "WebAssembly facade for the etendue kernel (npm @etendue/wasm)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
# Published to npm as `@etendue/wasm` only, never to crates.io
# (docs/adrs/0001-pivot.md).
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
etendue-kinematics = { workspace = true }
etendue-scene = { workspace = true }
etendue-synth = { workspace = true }
js-sys = { workspace = true }
nalgebra = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
vision-calibration-core = { workspace = true }
wasm-bindgen = { workspace = true }

