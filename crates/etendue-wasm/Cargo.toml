[package]
name = "etendue-wasm"
description = "WebAssembly facade for the etendue kernel (npm @etendue/wasm)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
# Published to npm as `@etendue/wasm` only, never to crates.io
# (docs/adrs/0001-pivot.md).
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
etendue-kinematics = { workspace = true }
etendue-scene = { workspace = true }
etendue-synth = { workspace = true }
js-sys = { workspace = true }
nalgebra = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
vision-calibration-core = { workspace = true }
wasm-bindgen = { workspace = true }

# Backend selection only; nothing calls it. On `wasm32-unknown-unknown`,
# `getrandom` 0.4 (via `vision-calibration-core` → `rand` 0.10 default
# features) refuses to build without a JS entropy backend. Enabling `wasm_js`
# here turns the backend on for the whole graph through feature unification;
# no etendue or calibration-rs code draws OS entropy. Drop this once the
# `vision-calibration-*` requirement moves to a release that includes
# calibration-rs#119 (`rand` with `default-features = false`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
