[package]
name = "etendue-core"
description = "Geometric and physical kernel for the etendue optical-design tool"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
nalgebra = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
vision-calibration-core = { workspace = true }
argmin = { workspace = true, optional = true }
argmin-math = { workspace = true, optional = true }

[features]
# The design-space solvers (`solver`), on argmin. Off by default: argmin pulls
# `rand` and OS entropy (`getrandom`), which the wasm graph keeps out.
solver = ["dep:argmin", "dep:argmin-math"]

[dev-dependencies]
approx = { workspace = true }
