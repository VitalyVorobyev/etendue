[package]
name = "etendue-cli"
description = "Command-line interface of etendue: validate scenes and scenarios, bake robot motion, render with Blender"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

# The pipeline as a library (load, gt, render, detect, poses), shared with the
# studio's Tauri shell; the binary is its command line.
[lib]
name = "etendue_cli"
path = "src/lib.rs"

[[bin]]
name = "etendue"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
calib-targets-chessboard = { workspace = true }
chess-corners = { workspace = true }
clap = { workspace = true }
etendue-kinematics = { workspace = true }
etendue-scene = { workspace = true }
etendue-synth = { workspace = true, features = ["images"] }
serde = { workspace = true }
serde_json = { workspace = true }
nalgebra = { workspace = true }
vision-calibration-core = { workspace = true }
vision-calibration-dataset = { workspace = true }
toml = { workspace = true }
