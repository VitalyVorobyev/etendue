[package]
name = "etendue-cli"
description = "The etendue command line: validate scenes and scenarios, bake robot motion, write calibration ground truth, render with Blender, detect the board"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

# The pipeline as a library (load, gt, render, detect, poses), shared with the
# studio's Tauri shell; the binary is its command line.
[lib]
name = "etendue_cli"
path = "src/lib.rs"

[[bin]]
name = "etendue"
path = "src/main.rs"

[dependencies]
etendue-core = { workspace = true }
anyhow = { workspace = true }
calib-targets-charuco = { workspace = true }
calib-targets-chessboard = { workspace = true }
calib-targets-marker = { workspace = true }
calib-targets-print = { workspace = true }
calib-targets-puzzleboard = { workspace = true }
chess-corners = { workspace = true }
clap = { workspace = true }
etendue-kinematics = { workspace = true }
etendue-scene = { workspace = true, features = ["schemars"] }
etendue-synth = { workspace = true, features = ["images", "schemars"] }
# The report and run documents carry JSON Schemas (schemas/, the studio's types).
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
nalgebra = { workspace = true }
vision-calibration-core = { workspace = true, features = ["schemars"] }
vision-calibration-dataset = { workspace = true }
vision-calibration-pipeline = { workspace = true, features = ["schemars"] }
toml = { workspace = true }
